apiVersion: batch/v1
kind: CronJob
metadata:
  name: starhub-rmf-maintenance
spec:
  # Hourly: delete vendor events older than 30 days; optional vendor re-sync.
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: starhub-rmf
            app.kubernetes.io/component: maintenance
        spec:
          serviceAccountName: starhub-rmf
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: maintenance
              image: starhub-rmf
              command: ["node", "--enable-source-maps", "dist-server/maintenance.mjs"]
              envFrom:
                - configMapRef:
                    name: rmf-config
                - secretRef:
                    name: rmf-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
