# Only the OpenShift router (and node health checks) may reach the web pods.
# Outbound traffic is unrestricted: the app calls Supabase and vendor clouds.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: starhub-rmf-allow-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: starhub-rmf
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/host-network: ""
      ports:
        - port: 8080
