apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: starhub-rmf
  annotations:
    # Keenon map discovery makes many sequential vendor calls; allow more than the 30s default.
    haproxy.router.openshift.io/timeout: 90s
spec:
  # host: set per overlay
  to:
    kind: Service
    name: starhub-rmf
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
