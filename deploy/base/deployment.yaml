apiVersion: apps/v1
kind: Deployment
metadata:
  name: starhub-rmf
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: starhub-rmf
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: starhub-rmf
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: starhub-rmf
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: starhub-rmf
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rmf-config
            - secretRef:
                name: rmf-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            # Give the load balancer time to deregister the pod and stop sending new
            # requests before the server closes.
            preStop:
              exec:
                command: ["sleep", "15"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
