apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: starhub-rmf
      app.kubernetes.io/part-of: starhub-rmf
    includeSelectors: false

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - cronjob.yaml
  - pdb.yaml
  - networkpolicy.yaml

# Non-secret settings. Overlays override values with `behavior: merge`.
# The secret (rmf-secrets) comes from each overlay's secretGenerator.
configMapGenerator:
  - name: rmf-config
    literals:
      - NODE_ENV=production
      # The OpenShift router terminates TLS and sets X-Forwarded-Proto/Host.
      - TRUST_PROXY=true
      # Public URL shown to vendors for callbacks.
      - PUBLIC_SITE_URL=https://CHANGE-ME.example.com
      # Only enable once the cluster's outbound IP is whitelisted by Keenon.
      - KEENON_SCHEDULED_SYNC=false
