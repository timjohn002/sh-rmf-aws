name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    # Builds and smoke-tests the container. On pushes to main it also pushes the image to
    # Amazon ECR, once these repository variables are set (Settings > Secrets and variables
    # > Actions > Variables):
    #   AWS_ROLE_ARN    IAM role GitHub may assume via OIDC, allowed to push to the repository
    #   ECR_REPOSITORY  e.g. 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/starhub-rmf
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write # lets the workflow request AWS credentials without stored keys
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.ECR_REPOSITORY != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: buildah bud --layers -f Containerfile -t starhub-rmf:${{ github.sha }} .
      - name: Smoke-test image
        run: |
          podman run -d --name rmf -p 8080:8080 \
            -e SESSION_SECRET=ci-only-session-secret-0123456789abcdef \
            -e SUPABASE_URL=https://example.invalid -e SUPABASE_SERVICE_ROLE_KEY=ci \
            --user 123456:0 starhub-rmf:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q '<title>Starhub RMF</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/auth/me)" = 401
          podman logs rmf
      - name: Log in to AWS
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Push to ECR
        if: env.PUSH == 'true'
        env:
          REPO: ${{ vars.ECR_REPOSITORY }}
          SHA: ${{ github.sha }}
        run: |
          aws ecr get-login-password | buildah login --username AWS --password-stdin "${REPO%%/*}"
          buildah push "starhub-rmf:$SHA" "docker://$REPO:$SHA"
          buildah push "starhub-rmf:$SHA" "docker://$REPO:main"
