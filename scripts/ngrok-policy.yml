# ngrok Traffic Policy for `npm run tunnel`: only vendor webhooks are reachable through
# the tunnel (/api/vendors/<vendor>/webhook[/<token>], and /keenon/webhook, which Keenon's
# portal calls). Everything else (login, the API, the web app) gets a 404 from ngrok and
# never reaches this machine.
on_http_request:
  - expressions:
      - "!req.url.path.matches('^(/api/vendors/[a-z0-9-]+/webhook(/[^/]+)?|/keenon/webhook)$')"
    actions:
      - type: custom-response
        config:
          status_code: 404
          body: Not found
